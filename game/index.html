<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Spot the Difference — Curious Corners</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    --ink: #2b2118;
    --paper: #fff7e8;
    --panel: #fffdf6;
    --accent: #e4572e;
    --teal: #0f766e;
    --gold: #f2a007;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #2e1f14;
    background-image: radial-gradient(circle at 20% 10%, #4a2f1d 0, transparent 55%),
                      radial-gradient(circle at 85% 90%, #3a2a1a 0, transparent 50%);
    color: var(--ink);
    font-family: "Trebuchet MS", "Segoe UI", Verdana, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 10px 12px 14px;
  }
  #app { width: 1240px; max-width: 98vw; }
  header {
    display: flex; align-items: center; justify-content: space-between;
    background: var(--paper); border: 3px solid #c89b5a; border-radius: 14px;
    padding: 8px 16px; box-shadow: 0 4px 0 #a67c3d;
  }
  header h1 { font-size: 24px; letter-spacing: .5px; color: #7c3f16; white-space: nowrap; }
  header h1 span { color: var(--accent); }
  #levelName { font-size: 15px; font-weight: bold; color: var(--teal); white-space: nowrap; }
  #hud { display: flex; gap: 10px; align-items: center; font-size: 15px; font-weight: bold; }
  .pill {
    background: #fff; border: 2px solid #c89b5a; border-radius: 999px;
    padding: 4px 12px; white-space: nowrap;
  }
  .pill b { color: var(--accent); }
  #timerBarWrap {
    height: 12px; background: #e8dcc3; border-radius: 999px; overflow: hidden;
    border: 2px solid #c89b5a; margin: 10px 2px 0;
  }
  #timerBar { height: 100%; width: 100%; background: linear-gradient(90deg, #2f9e44, #f2a007, #e4572e); transition: width .2s linear; }
  #timerBar.low { animation: pulse .5s infinite alternate; }
  @keyframes pulse { from { filter: brightness(1); } to { filter: brightness(1.5); } }
  #boards {
    display: flex; gap: 14px; margin-top: 10px; justify-content: center;
  }
  .board {
    background: var(--panel); border: 3px solid #c89b5a; border-radius: 12px;
    padding: 8px; box-shadow: 0 4px 0 #a67c3d; position: relative;
  }
  .board h2 {
    position: absolute; top: -13px; left: 14px; font-size: 14px;
    background: var(--gold); color: #3a2503; padding: 2px 10px; border-radius: 999px;
    border: 2px solid #b97f06;
  }
  .board canvas { display: block; width: 580px; height: 372px; border-radius: 8px; cursor: crosshair; }
  .board canvas.shake { animation: shake .3s; }
  @keyframes shake {
    0%,100% { transform: translate(0,0); } 25% { transform: translate(-4px,2px); }
    50% { transform: translate(4px,-2px); } 75% { transform: translate(-3px,-1px); }
  }
  #below {
    display: flex; gap: 14px; margin-top: 12px; align-items: stretch;
  }
  #msg {
    flex: 1; background: var(--paper); border: 3px solid #c89b5a; border-radius: 12px;
    padding: 10px 16px; font-size: 17px; font-weight: bold; color: #5b3a1a;
    display: flex; align-items: center; box-shadow: 0 4px 0 #a67c3d;
  }
  #controls { display: flex; gap: 8px; }
  button {
    font-family: inherit; font-size: 15px; font-weight: bold; cursor: pointer;
    border: 3px solid #7c3f16; border-radius: 12px; padding: 10px 16px;
    background: var(--gold); color: #3a2503; box-shadow: 0 3px 0 #7c3f16;
  }
  button:active { transform: translateY(2px); box-shadow: 0 1px 0 #7c3f16; }
  button.secondary { background: #fff; color: var(--teal); border-color: var(--teal); box-shadow: 0 3px 0 var(--teal); }
  button:disabled { opacity: .45; cursor: default; }
  #overlay {
    position: fixed; inset: 0; background: rgba(30,18,8,.72);
    display: none; align-items: center; justify-content: center; z-index: 10;
  }
  #overlay.show { display: flex; }
  #card {
    background: var(--paper); border: 4px solid #c89b5a; border-radius: 18px;
    padding: 28px 34px; max-width: 640px; text-align: center; box-shadow: 0 10px 0 #a67c3d;
  }
  #card h2 { font-size: 34px; color: #7c3f16; margin-bottom: 10px; }
  #card p { font-size: 17px; line-height: 1.5; margin-bottom: 12px; }
  #card .big { font-size: 22px; font-weight: bold; color: var(--accent); }
  #card .keys { font-size: 14px; color: #6b4a2a; }
  #card button { margin-top: 8px; font-size: 18px; padding: 12px 26px; }
  #levelDots { display: flex; gap: 6px; justify-content: center; margin-top: 10px; }
  #levelDots i {
    width: 14px; height: 14px; border-radius: 50%; background: #d9c49a;
    border: 2px solid #a67c3d; display: inline-block;
  }
  #levelDots i.done { background: #2f9e44; }
  #levelDots i.now { background: var(--accent); }
  footer { margin-top: 10px; color: #d9c49a; font-size: 13px; text-align: center; }
  footer kbd { background: #fff7e8; color: #5b3a1a; border-radius: 4px; padding: 1px 6px; font-weight: bold; }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>Spot the Difference <span>· Curious Corners</span></h1>
    <div id="levelName">Level 1 · Sunny Garden</div>
    <div id="hud">
      <span class="pill">Found <b id="foundCount">0 / 5</b></span>
      <span class="pill">Score <b id="score">0</b></span>
      <span class="pill">Combo <b id="combo">×1</b></span>
      <span class="pill">⏱ <b id="clock">02:00</b></span>
      <span class="pill">Hints <b id="hints">3</b></span>
    </div>
  </header>
  <div id="timerBarWrap"><div id="timerBar"></div></div>
  <div id="boards">
    <div class="board"><h2>Picture A</h2><canvas id="panelA" width="580" height="372"></canvas></div>
    <div class="board"><h2>Picture B</h2><canvas id="panelB" width="580" height="372"></canvas></div>
  </div>
  <div id="below">
    <div id="msg">Click a difference on either picture — or press H for a hint.</div>
    <div id="controls">
      <button id="hintBtn" type="button">💡 Hint (H)</button>
      <button id="restartBtn" type="button" class="secondary">↻ Restart (R)</button>
    </div>
  </div>
  <div id="levelDots"><i class="now"></i><i></i><i></i></div>
  <footer>Click with the mouse · <kbd>H</kbd> hint · <kbd>R</kbd> restart level · <kbd>1</kbd>/<kbd>2</kbd>/<kbd>3</kbd> jump to a level · <kbd>M</kbd> sound on/off</footer>
</div>
<div id="overlay"><div id="card"></div></div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
